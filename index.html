<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимированное дерево</title>
    <style>
        html {
    box-sizing: border-box;
    }
    *,
    *::before,
    *::after {
        box-sizing: inherit;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        background: linear-gradient(180deg, #c8f7f0 0%, #7ed6c8 100%);
    }

    /* холст */
    .canvas {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        width: 100%;
        max-width: 750px;
        height: 1000px;
    }

    /* ствол и ветки */
    .trunk,
    .branch {
        border-radius: 25px;
        background: linear-gradient(to right, #7f3333, #4d2020);
    }

    .trunk {
        position: relative;
        width: 10px;
        height: 500px;
        margin: 0 auto;
    }

    .branch {
        position: absolute;
        width: 5px;
        left: calc(50% - 2.5px);
        transform-origin: bottom center;
    }

    .branch:nth-child(even) { transform: rotate(60deg); }
    .branch:nth-child(odd)  { transform: rotate(-60deg); }

    .branch:nth-child(1) { top: 180px; height: 180px; }
    .branch:nth-child(2) { top: 160px; height: 150px; }
    .branch:nth-child(3) { top: 120px; height: 150px; }
    .branch:nth-child(4) { top: 110px; height: 130px; }
    .branch:nth-child(5) { top:  85px; height: 120px; }
    .branch:nth-child(6) { top:  70px; height: 105px; }
    .branch:nth-child(7) { top:  45px; height:  95px; }
    .branch:nth-child(8) { top:  35px; height:  80px; }

    /* листья */
    .leaf {
        position: absolute;
        width: 15px;
        height: 15px;
        border-radius: 75% 0 75% 0;
        background: linear-gradient(to right, #ff9ec7, #e83e8c);
    }

    .leaf:nth-child(1) { top:  5px; animation-delay: 2.5s; }
    .leaf:nth-child(2) { top: 20px; animation-delay: 2s;   }
    .leaf:nth-child(3) { top: 50px; animation-delay: 1.5s; }

    .leaf:nth-child(odd) {
        left: 100%;
        transform-origin: 0% 100%;
        animation-name: leaf-odd-grow;
        animation-duration: 3s;
        animation-fill-mode: both;
    }

    .leaf:nth-child(even) {
        left: -150%;
        transform-origin: 50% 100%;
        animation-name: leaf-even-grow;
        animation-duration: 3s;
        animation-fill-mode: both;
    }

    @keyframes leaf-odd-grow {
        0%   { transform: scale(0); }
        100% { transform: scale(1); }
    }

    @keyframes leaf-even-grow {
        0%   { transform: rotate(-90deg) scale(0); }
        100% { transform: rotate(-90deg) scale(1); }
    }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="tree">
            <div class="trunk">

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
